<!DOCTYPE html>
<html>

<head>

    <title>HDI Result</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:url("{{ url_for('static', filename='result.jpg') }}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

        }

        .container{

            width:900px;

            background:#000;

            border-radius:20px;

            padding:60px;

            text-align:center;

            box-shadow:0 0 25px black;

        }

        h1{

            color:red;

            font-size:58px;

            margin-bottom:40px;

        }

        .country{

            color:white;

            font-size:32px;

            font-weight:bold;

            margin-bottom:40px;

        }

        .score{

            color:#00d9ff;

            font-size:80px;

            font-weight:bold;

            margin-bottom:40px;

        }

        .result{

            color:#00ff66;

            font-size:42px;

            font-weight:bold;

            margin-bottom:50px;

        }

        .btn{

            display:inline-block;

            width:300px;

            height:65px;

            line-height:65px;

            text-decoration:none;

            color:white;

            font-size:30px;

            font-weight:bold;

            border-radius:40px;

            background:linear-gradient(to right,#4facfe,#b84cff);

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Human Development Index</h1>

    <div class="country">

        Country : {{ country }}

    </div>

    <div class="score">

        {{ prediction }}

    </div>

    <div class="result">

        {{ message }}

    </div>

    <a href="/predictpage" class="btn">

        Predict Again

    </a>

</div>

</body>

</html>
